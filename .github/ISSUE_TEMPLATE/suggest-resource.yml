name: Suggest a Resource
description: Suggest a collision detection library, paper, book, article, or related curated list
title: "[Suggestion] "
labels: ["suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        Automation checks every suggestion against the [acceptance bar](https://github.com/jslee02/awesome-collision-detection/blob/main/CONTRIBUTING.md#acceptance-bar): for GitHub-hosted software, at least 6 months old (or 1,000+ stars), 100+ stars, 3+ outside people who opened issues or PRs, a commit within 12 months, and a license. Non-software resources receive maintainer review, even when linked from GitHub. Please keep one open suggestion at a time.

  - type: input
    id: name
    attributes:
      label: Resource Name
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL
      description: Resource website, publication URL, or repository URL if there is no website
    validations:
      required: true

  - type: input
    id: github
    attributes:
      label: GitHub Repository
      description: "GitHub `owner/repo` (e.g., `flexible-collision-library/fcl`). Leave blank if the project is not on GitHub; a maintainer will review it."
      placeholder: owner/repo

  - type: input
    id: alt_repo
    attributes:
      label: Alternative Repository
      description: GitLab, Bitbucket, or other source URL, if not on GitHub
      placeholder: https://gitlab.com/org/project

  - type: textarea
    id: evidence
    attributes:
      label: Evidence of use
      description: "Required for resources not on GitHub, commercial tools, and non-software resources: show wide use in collision detection or related geometry, for example independent users or customers, citations, or third-party tutorials."

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: "Pick by the resource's main subject and role. See the [category definitions](https://github.com/jslee02/awesome-collision-detection/blob/main/CONTRIBUTING.md#categories)."
      options:
        - Libraries
        - Mesh Processing
        - Papers
        - Books
        - Articles
        - Other Awesome Lists
        - Not sure
    validations:
      required: true

  - type: input
    id: description
    attributes:
      label: Description
      description: "One neutral sentence, 100 characters or fewer, e.g. `C++ library for collision, distance, and continuous collision queries.`"
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why should it be included?
      description: Optional. What gap does it fill, and who uses it?

  - type: dropdown
    id: affiliation
    attributes:
      label: Affiliation
      description: Suggesting your own project is welcome; we just ask you to say so.
      options:
        - I am an author or maintainer
        - I contribute to it
        - I use it
        - No affiliation
    validations:
      required: true

  - type: checkboxes
    id: attestation
    attributes:
      label: Confirmation
      options:
        - label: I am a person, and I wrote or reviewed this suggestion myself.
          required: true
